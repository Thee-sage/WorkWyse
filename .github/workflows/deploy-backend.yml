name: Deploy backend to Azure

# Deploys Backend/ to the workwyse-api App Service on every push to main.
#
# The build happens here on a Linux runner rather than on the App Service
# itself: Oryx's build-on-deploy was both slow and opaque when it failed,
# and building here means the artifact shipped to Azure is exactly what CI
# already typechecked and tested.
on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: Backend
        # Backend/.npmrc sets legacy-peer-deps, needed because traceops-sdk
        # declares a peer dep on express@4 while this app runs express@5.
        run: npm ci

      - name: Typecheck
        working-directory: Backend
        run: npm run typecheck

      - name: Build
        working-directory: Backend
        run: npm run build

      - name: Prune to production dependencies
        working-directory: Backend
        # devDependencies (typescript, jest, ts-node) aren't needed at
        # runtime and roughly halve the artifact size if dropped.
        run: npm prune --omit=dev

      - name: Assemble deployment artifact
        run: |
          mkdir -p deploy
          cp -r Backend/dist deploy/dist
          cp -r Backend/node_modules deploy/node_modules
          cp Backend/package.json deploy/package.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: workwyse-api
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deploy
